[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqari"
version = "0.1.0"
description = "Aqari synthetic real-estate workflow Frappe application"
requires-python = ">=3.14,<3.15"
authors = [{name = "Aqari platform team"}]
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["aqari*"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
